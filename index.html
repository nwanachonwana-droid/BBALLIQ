<!doctype html>
<html lang="en">
<head>
<!-- SITE BUILD v34 -- bump this and the install.sh site check together -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharpz Basketball — tonight</title>
<meta name="description" content="Tonight's five.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0A0D12; --panel: #0E1219; --line: #1C232E;
    --ink: #ECEFF4; --mid: #8B98A9; --dim: #6B7A8D; --hot: #FF6B2C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: 'IBM Plex Sans', system-ui, sans-serif;
         overflow-x: hidden; }
  a { color: var(--hot); }
  a:hover { color: #FF8A52; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .arch { font-family: 'Archivo', sans-serif; }

  .pick { display: flex; gap: 14px; align-items: baseline;
          padding: 22px 0; border-top: 1px solid var(--line); }
  .rank { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
          color: var(--hot); letter-spacing: 1px; min-width: 52px;
          flex: 0 0 auto; }
  .who  { flex: 1 1 auto; min-width: 0; }
  .nm   { font-family: 'Archivo', sans-serif; font-weight: 700;
          font-size: 25px; letter-spacing: -0.5px; line-height: 1.15; }
  .mk   { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
          letter-spacing: 1.6px; color: var(--hot); margin-top: 6px; }
  .vs   { color: var(--dim); font-size: 14px; margin-top: 5px; }
  .num  { text-align: right; flex: 0 0 auto; }
  .big  { font-family: 'Archivo', sans-serif; font-weight: 700;
          font-size: 29px; letter-spacing: -0.5px; }
  .unit { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          color: var(--dim); letter-spacing: 1px; margin-top: 3px; }
  @media (max-width: 520px) {
    .nm { font-size: 21px; } .big { font-size: 24px; }
    .rank { min-width: 40px; }
  }
</style>
</head>
<body>

<div style="border-bottom: 1px solid var(--line)">
  <div class="wrap" style="padding-top: 20px; padding-bottom: 20px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Sharpz Basketball">
        <circle cx="16" cy="16" r="14" fill="#FF6B2C"></circle>
        <path d="M16 2 L16 30 M2 16 L30 16" stroke="#0A0D12" stroke-width="1.7"></path>
        <path d="M6.2 5.4 Q15 16 6.2 26.6" fill="none" stroke="#0A0D12" stroke-width="1.7"></path>
        <path d="M25.8 5.4 Q17 16 25.8 26.6" fill="none" stroke="#0A0D12" stroke-width="1.7"></path>
      </svg>
      <div style="line-height: 1">
        <div class="arch" style="font-weight: 800; font-size: 19px; letter-spacing: -0.4px">SHARPZ</div>
        <div class="mono" style="font-size: 9px; letter-spacing: 3.4px; color: var(--hot); margin-top: 3px">BASKETBALL</div>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center">
      <a href="performance.html" style="color: var(--mid); text-decoration: none; font-size: 15px">Performance</a>
    </div>
  </div>
</div>

<div class="wrap" style="padding-top: 54px; padding-bottom: 80px">
  <h1 class="arch" style="font-weight: 800; font-size: 46px; line-height: 1.02; letter-spacing: -1.6px; margin: 0 0 10px">
    Tonight
  </h1>
  <div class="mono" id="dateline" style="font-size: 12px; letter-spacing: 1px; color: var(--dim); margin-bottom: 30px"></div>

  <div id="picks"></div>

  <div id="collegeWrap" hidden>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
         justify-content: space-between; margin: 54px 0 4px">
      <h2 class="arch" style="font-weight: 800; font-size: 30px;
          letter-spacing: -0.9px; margin: 0">College</h2>
      <div class="mono" id="collegeMeta" style="font-size: 11px;
           letter-spacing: 1.4px; color: var(--dim)"></div>
    </div>
    <!-- Band toggle. Opens on 70-80%: the band where the model has a
         real opinion about a real game. 90-100% in November is mostly
         buy games, which are right and unactionable. -->
    <div id="collegeBands" style="display: flex; flex-wrap: wrap; gap: 8px;
         margin: 14px 0 2px"></div>
    <div id="college"></div>
  </div>

  <!-- The only sentence on the page. It is not an explanation of the
       model, it is what these five ARE: no line was looked at, so
       they are spots, not bets. Without it a visitor reads five names
       on a betting site as five bets. -->
  <div id="foot" class="mono" style="margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.8; color: var(--dim); letter-spacing: 0.3px"></div>
</div>

<script>
const UNIT = { pts: 'POINTS', threes: 'THREES', reb: 'REBOUNDS', ast: 'ASSISTS' };
const SHORT = { pts: 'pts', threes: '3PM', reb: 'reb', ast: 'ast' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Board rows store names normalised to lowercase, and a naive
// capitalise-every-word turns "pj washington" into "Pj Washington" and
// "jaden mcdaniels" into "Jaden Mcdaniels". A name a reader sees
// misspelled is the cheapest possible way to look careless.
// Anything that already carries a capital came from a box score and
// is left exactly as it is.
const INITIALS = new Set(['pj','cj','tj','aj','jt','rj','kj','bj','dj','jj']);
const SUFFIX = { jr: 'Jr.', sr: 'Sr.', ii: 'II', iii: 'III', iv: 'IV' };
const cap = w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w;
function title(s) {
  s = String(s || '');
  if (/[A-Z]/.test(s)) return s;
  return s.split(/\s+/).map(w => {
    const k = w.toLowerCase(), bare = k.replace(/\./g, '');
    if (SUFFIX[bare]) return SUFFIX[bare];
    if (INITIALS.has(bare)) return bare.toUpperCase();
    if (/^mc[a-z]{2,}$/.test(k)) return 'Mc' + cap(k.slice(2));
    if (/^[od]'[a-z]+$/.test(k)) return cap(k.slice(0, 1)) + "'" + cap(k.slice(2));
    return k.split('-').map(cap).join('-');
  }).join(' ');
}

function dayText(d) {
  if (!/^\d{8}$/.test(d || '')) return '';
  const dt = new Date(+d.slice(0,4), +d.slice(4,6) - 1, +d.slice(6,8));
  return dt.toLocaleDateString('en-US',
    { weekday: 'long', month: 'long', day: 'numeric' });
}

function render(d) {
  const rows = (d && d.goto) || [];
  const dl = document.getElementById('dateline');
  const box = document.getElementById('picks');
  const ft = document.getElementById('foot');
  dl.textContent = dayText(d && d.day).toUpperCase();

  if (!rows.length) {
    box.innerHTML = `<div style="border-top: 1px solid var(--line);
      padding: 30px 0; font-size: 17px; color: var(--mid)">Nothing
      tonight.</div>`;
    ft.textContent = '';
    return;
  }
  box.innerHTML = rows.map((r, i) => `
    <div class="pick">
      <div class="rank">${'★'.repeat(rows.length - i)}</div>
      <div class="who">
        <div class="nm">${esc(title(r.player))}</div>
        <div class="mk">${esc(UNIT[r.market] || r.market)}</div>
        <div class="vs">${esc(r.team)} vs ${esc(r.opp)}</div>
      </div>
      <div class="num">
        <div class="big">${Number(r.base).toFixed(1)}</div>
        <div class="unit">${esc(SHORT[r.market] || '')}</div>
      </div>
    </div>`).join('');
  ft.textContent = 'No line was consulted. These are spots, not bets.';
}


// --- COLLEGE ---------------------------------------------------------
// Binary winner calls, gated at 60% because that is the one finding in
// the paper strong enough to act on: below it the system ran 56.8% on
// n=377, at or above it 78.2% on n=1,167. A game that misses the gate
// is not a quiet pick, it is not a pick.
const BANDS = [
  { key: '90', lo: 0.90, hi: 1.01, label: '90-100%' },
  { key: '80', lo: 0.80, hi: 0.90, label: '80-90%' },
  { key: '70', lo: 0.70, hi: 0.80, label: '70-80%' },
  { key: '60', lo: 0.60, hi: 0.70, label: '60-70%' },
];
let COLLEGE = [], BAND = '70';

function collegeRows(rows) {
  const b = BANDS.find(x => x.key === BAND) || BANDS[2];
  return rows.filter(r => r.conf >= b.lo && r.conf < b.hi);
}

function collegeTabs() {
  const bar = document.getElementById('collegeBands');
  if (!bar) return;
  bar.innerHTML = BANDS.map(b => {
    const n = COLLEGE.filter(r => r.conf >= b.lo && r.conf < b.hi).length;
    const on = b.key === BAND;
    return `<button data-band="${b.key}" ${n ? '' : 'disabled'}
      style="font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      letter-spacing: 0.6px; padding: 7px 13px; border-radius: 999px;
      cursor: ${n ? 'pointer' : 'default'}; transition: all .12s;
      border: 1px solid ${on ? 'var(--hot)' : 'var(--line)'};
      background: ${on ? 'var(--hot)' : 'transparent'};
      color: ${on ? '#0A0D12' : (n ? 'var(--mid)' : '#3A4350')}">${
        b.label}<span style="opacity:.65; margin-left:7px">${n}</span></button>`;
  }).join('');
  bar.querySelectorAll('button[data-band]').forEach(el => {
    el.addEventListener('click', () => {
      if (el.disabled) return;
      BAND = el.getAttribute('data-band');
      collegeTabs();
      collegePaint();
    });
  });
}

function collegePaint() {
  const box = document.getElementById('college');
  if (!box) return;
  const rows = collegeRows(COLLEGE);
  if (!rows.length) {
    box.innerHTML = `<div style="border-top: 1px solid var(--line);
      padding: 24px 0; font-size: 16px; color: var(--mid)">Nothing in
      this band tonight.</div>`;
    return;
  }
  box.innerHTML = rows.map(r => `
    <div class="pick">
      <div class="rank">${Math.round(r.conf * 100)}%</div>
      <div class="who">
        <div class="nm">${esc(r.pick_name)}</div>
        <div class="vs">${esc(r.away_name)} ${r.neutral ? 'vs' : 'at'}
          ${esc(r.home_name)}</div>
        ${r.venue_flag ? `<div style="font-size: 12px; margin-top: 5px;
          color: ${r.venue_effect === 'shakier' ? '#C3A14E' : '#6E8B7A'}">${
            r.venue_effect === 'shakier'
              ? (r.venue_flag === 'weak_road'
                  ? 'Shakier than it looks — this pick is a weak road team, and the model has historically given those about 18 points too much credit.'
                  : 'Shakier than it looks — this pick is against a strong road team, and the model has historically given those about 15 points too little credit.')
              : (r.venue_flag === 'weak_road'
                  ? 'If anything understated — the opponent is a weak road team, and the model has historically overrated those.'
                  : 'If anything understated — this pick is a strong road team, and the model has historically underrated those.')
          }</div>` : ''}
      </div>
      <div class="num">
        <div class="big">${Math.abs(Number(r.margin)).toFixed(0)}</div>
        <div class="unit">MARGIN</div>
      </div>
    </div>`).join('');
}

function collegeRender(d) {
  const wrap = document.getElementById('collegeWrap');
  const meta = document.getElementById('collegeMeta');
  if (!wrap) return;
  COLLEGE = (d && d.picks) || [];
  wrap.hidden = false;
  if (meta) {
    meta.textContent = COLLEGE.length
      ? `${COLLEGE.length} CLEAR ${Math.round((d.gate || 0.6) * 100)}%`
      : `NOTHING CLEARS ${Math.round(((d && d.gate) || 0.6) * 100)}%`;
  }
  // Open on a band that actually has something, preferring 70-80.
  if (!collegeRows(COLLEGE).length) {
    const alt = BANDS.find(b =>
      COLLEGE.some(r => r.conf >= b.lo && r.conf < b.hi));
    if (alt) BAND = alt.key;
  }
  collegeTabs();
  collegePaint();
}

fetch('data/college.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d) collegeRender(d); })
  .catch(() => {});

fetch('data/boards.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(render)
  .catch(() => render(null));
</script>
</body>
</html>
