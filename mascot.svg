<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- ── SHADOW ── -->
  <ellipse cx="100" cy="308" rx="45" ry="8" fill="rgba(0,0,0,0.25)"/>

  <!-- ── LEGS ── -->
  <rect x="72" y="230" width="22" height="60" rx="8" fill="#1a1a2e"/>
  <rect x="106" y="230" width="22" height="60" rx="8" fill="#1a1a2e"/>
  <!-- Sneakers -->
  <rect x="64" y="282" width="34" height="16" rx="6" fill="#e8ff3c"/>
  <rect x="98" y="282" width="34" height="16" rx="6" fill="#e8ff3c"/>
  <!-- Sneaker detail -->
  <path d="M68 290 Q80 286 94 290" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none"/>
  <path d="M102 290 Q114 286 128 290" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none"/>

  <!-- ── HOODIE BODY ── -->
  <path d="M55 145 Q45 165 42 200 Q40 230 42 250 L158 250 Q160 230 158 200 Q155 165 145 145 Z" fill="#1e1e3a"/>
  <!-- Hoodie pocket -->
  <rect x="78" y="200" width="44" height="28" rx="8" fill="#16162a"/>
  <!-- Hoodie front zip line -->
  <line x1="100" y1="155" x2="100" y2="230" stroke="#2a2a4a" stroke-width="2"/>
  <!-- Hoodie strings -->
  <line x1="92" y1="158" x2="85" y2="178" stroke="#2a2a4a" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="158" x2="115" y2="178" stroke="#2a2a4a" stroke-width="2" stroke-linecap="round"/>
  <!-- String tips -->
  <circle cx="85" cy="180" r="3" fill="#e8ff3c"/>
  <circle cx="115" cy="180" r="3" fill="#e8ff3c"/>

  <!-- ── LEFT ARM (holding phone) ── -->
  <path d="M55 155 Q32 170 28 195 Q26 210 35 215 Q44 218 50 205 Q54 192 62 180 Z" fill="#1e1e3a"/>
  <!-- Hand -->
  <ellipse cx="34" cy="218" rx="12" ry="10" fill="#8B5E3C"/>
  <!-- Fingers -->
  <path d="M26 212 Q22 206 24 202 Q27 199 30 204" fill="#8B5E3C" stroke="#7a4f2e" stroke-width="0.5"/>
  <path d="M24 218 Q19 214 20 209 Q23 205 27 210" fill="#8B5E3C" stroke="#7a4f2e" stroke-width="0.5"/>

  <!-- ── PHONE ── -->
  <rect x="8" y="195" width="32" height="52" rx="5" fill="#0d0d1a" stroke="#e8ff3c" stroke-width="1.5"/>
  <!-- Phone screen -->
  <rect x="11" y="199" width="26" height="40" rx="3" fill="#111428"/>
  <!-- Chart on phone -->
  <polyline points="13,233 17,225 21,228 25,218 29,220 33,212" stroke="#e8ff3c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chart area fill -->
  <polygon points="13,233 17,225 21,228 25,218 29,220 33,212 33,236 13,236" fill="rgba(232,255,60,0.12)"/>
  <!-- Phone home button -->
  <circle cx="24" cy="243" r="2" fill="#1e1e3a"/>

  <!-- ── RIGHT ARM ── -->
  <path d="M145 155 Q168 170 172 195 Q174 210 165 215 Q156 218 150 205 Q146 192 138 180 Z" fill="#1e1e3a"/>
  <!-- Right hand -->
  <ellipse cx="166" cy="218" rx="12" ry="10" fill="#8B5E3C"/>
  <!-- Fingers pointing up / thumbs up -->
  <path d="M160 210 Q162 200 167 198 Q172 197 172 204 Q172 210 166 212" fill="#8B5E3C" stroke="#7a4f2e" stroke-width="0.5"/>
  <path d="M171 206 Q176 204 177 208 Q177 213 172 214" fill="#8B5E3C" stroke="#7a4f2e" stroke-width="0.5"/>

  <!-- ── NECK ── -->
  <rect x="88" y="128" width="24" height="22" rx="6" fill="#8B5E3C"/>

  <!-- ── HEAD ── -->
  <ellipse cx="100" cy="108" rx="42" ry="46" fill="#8B5E3C"/>
  <!-- Head highlight -->
  <ellipse cx="88" cy="88" rx="16" ry="12" fill="rgba(255,255,255,0.07)" transform="rotate(-15,88,88)"/>

  <!-- ── EARS ── -->
  <ellipse cx="58" cy="110" rx="8" ry="11" fill="#8B5E3C"/>
  <ellipse cx="58" cy="110" rx="5" ry="7" fill="#7a4f2e"/>
  <ellipse cx="142" cy="110" rx="8" ry="11" fill="#8B5E3C"/>
  <ellipse cx="142" cy="110" rx="5" ry="7" fill="#7a4f2e"/>

  <!-- ── HOODIE HOOD (behind head) ── -->
  <path d="M62 105 Q58 75 68 55 Q80 35 100 32 Q120 35 132 55 Q142 75 138 105 Q125 90 100 88 Q75 90 62 105 Z" fill="#16162a"/>
  <!-- Hood inner -->
  <path d="M68 105 Q66 80 74 62 Q84 44 100 42 Q116 44 126 62 Q134 80 132 105 Q120 94 100 92 Q80 94 68 105 Z" fill="#1e1e3a"/>

  <!-- ── HAIR (fade / low cut) ── -->
  <path d="M62 105 Q60 88 65 72 Q72 56 84 50 Q100 46 116 50 Q128 56 135 72 Q140 88 138 105 Q125 96 100 95 Q75 96 62 105 Z" fill="#1a0a00"/>

  <!-- ── EYES ── -->
  <!-- Eye whites -->
  <ellipse cx="86" cy="108" rx="10" ry="9" fill="white"/>
  <ellipse cx="114" cy="108" rx="10" ry="9" fill="white"/>
  <!-- Irises -->
  <circle cx="87" cy="109" r="6" fill="#3d2b1f"/>
  <circle cx="115" cy="109" r="6" fill="#3d2b1f"/>
  <!-- Pupils -->
  <circle cx="88" cy="109" r="3.5" fill="#0d0800"/>
  <circle cx="116" cy="109" r="3.5" fill="#0d0800"/>
  <!-- Eye shine -->
  <circle cx="90" cy="107" r="1.5" fill="white"/>
  <circle cx="118" cy="107" r="1.5" fill="white"/>
  <!-- Eyebrows — slightly raised/confident -->
  <path d="M77 98 Q86 93 96 96" stroke="#1a0a00" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M104 96 Q114 93 123 98" stroke="#1a0a00" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ── NOSE ── -->
  <path d="M97 114 Q100 120 103 114" stroke="#6b3f20" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="95" cy="116" r="2.5" fill="#7a4f2e"/>
  <circle cx="105" cy="116" r="2.5" fill="#7a4f2e"/>

  <!-- ── MOUTH (slight smirk) ── -->
  <path d="M88 127 Q100 136 113 127" stroke="#5c2e0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Teeth peek -->
  <path d="M93 128 Q100 134 107 128 Q100 131 93 128 Z" fill="white" opacity="0.8"/>

  <!-- ── GLASSES ── -->
  <!-- Left lens -->
  <rect x="74" y="101" width="22" height="16" rx="6" fill="none" stroke="#e8ff3c" stroke-width="2"/>
  <rect x="74" y="101" width="22" height="16" rx="6" fill="rgba(232,255,60,0.08)"/>
  <!-- Right lens -->
  <rect x="104" y="101" width="22" height="16" rx="6" fill="none" stroke="#e8ff3c" stroke-width="2"/>
  <rect x="104" y="101" width="22" height="16" rx="6" fill="rgba(232,255,60,0.08)"/>
  <!-- Bridge -->
  <line x1="96" y1="109" x2="104" y2="109" stroke="#e8ff3c" stroke-width="2"/>
  <!-- Left arm -->
  <line x1="74" y1="109" x2="62" y2="111" stroke="#e8ff3c" stroke-width="2"/>
  <!-- Right arm -->
  <line x1="126" y1="109" x2="138" y2="111" stroke="#e8ff3c" stroke-width="2"/>
  <!-- Glasses lens shine -->
  <path d="M77 104 Q80 102 84 104" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none"/>
  <path d="M107 104 Q110 102 114 104" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none"/>

  <!-- ── HOODIE LOGO (small Basketball IQ mark) ── -->
  <circle cx="100" cy="178" r="8" fill="none" stroke="#e8ff3c" stroke-width="1.5" opacity="0.6"/>
  <text x="100" y="182" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#e8ff3c" opacity="0.6">IQ</text>

  <!-- ── FLOATING CHART SPARKLE (top right) ── -->
  <g opacity="0.7" transform="translate(148, 58)">
    <rect width="36" height="26" rx="5" fill="#111428" stroke="#e8ff3c" stroke-width="1"/>
    <polyline points="3,20 8,14 13,16 18,9 23,11 29,5 33,7" stroke="#e8ff3c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="3,20 8,14 13,16 18,9 23,11 29,5 33,7 33,22 3,22" fill="rgba(232,255,60,0.1)"/>
  </g>

  <!-- ── FLOATING DOLLAR (top left) ── -->
  <g opacity="0.65" transform="translate(14, 48)">
    <circle cx="14" cy="14" r="13" fill="#111428" stroke="#22c55e" stroke-width="1.2"/>
    <text x="14" y="19" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#22c55e">$</text>
  </g>

  <!-- ── FLOATING PERCENT (above head) ── -->
  <g opacity="0.5" transform="translate(88, 8)">
    <text x="12" y="18" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#e8ff3c">%</text>
  </g>
</svg>
